  /api/mock/office_task/query_task_recycle_archive:
    get:
      operationId: query_task_recycle_archive
      summary: 任务管理系统_任务_查询回收站，归档区接口
      description: 回收站（归档区）分页查询。
      parameters:
        - name: area
          in: query
          description: 查询区域，支持 recycle、archive、all。
          schema:
            type: string
            default: all
        - name: page
          in: query
          description: 页码。
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: 每页数量。
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: mock 回收站归档区列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/change_task_set_members:
