      operationId: soft_delete_task_set
      summary: 任务管理系统_任务集_逻辑删除任务集接口
      description: 根据taskSetId删除任务集及关联的任务（加入回收站）。mock 阶段只返回模拟结果。
      requestBody:
        content:
