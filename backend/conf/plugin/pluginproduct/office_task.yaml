info:
  description: |-
    企业任务管理 mock 插件，面向超级个人助手演示任务管理系统能力。
    当前只使用 mock 数据，写入、删除、归档、恢复等变更类接口返回模拟结果，不会直接修改真实任务系统。
  title: 企业任务管理
  version: v1
openapi: 3.0.1
paths:
  /api/mock/office_task/ai_get_task_info:
    get:
      operationId: ai_get_task_info
      summary: 任务管理系统_任务_查询任务信息_AI
      description: 查询任务信息，供ai查询。
      parameters:
        - name: task_id
          in: query
          description: 任务 ID，例如 TASK-1001。
          schema:
            type: string
        - name: keyword
          in: query
          description: 任务关键词，可匹配标题、描述、项目、负责人等。
          schema:
            type: string
      responses:
        "200":
          description: mock 任务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/ai_count_work_hours:
    post:
      operationId: ai_count_work_hours
      summary: 任务管理系统_任务_统计工时信息_AI
      description: 统计工时信息，供ai查询。
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkHourQuery"
      responses:
        "200":
          description: mock 工时统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/export_personal_work_hours:
    get:
      operationId: export_personal_work_hours
      summary: 任务管理系统_统计_个人工时导出接口
      description: 导出个人工时汇总。
      parameters:
        - name: user_name
          in: query
          description: 人员姓名，默认当前用户。
          schema:
            type: string
        - name: start_date
          in: query
          description: 开始日期，格式 2006-01-02。
          schema:
            type: string
        - name: end_date
          in: query
          description: 结束日期，格式 2006-01-02。
          schema:
            type: string
        - name: format
          in: query
          description: 导出格式，支持 xlsx、csv。
          schema:
            type: string
            default: xlsx
      responses:
        "200":
          description: mock 导出信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/get_task_set_member_workload:
    get:
      operationId: get_task_set_member_workload
      summary: 任务管理系统_报表统计_获取任务集底下人员工作量接口
      description: 获取任务集底下人员工作量。
      parameters:
        - name: task_set_id
          in: query
          description: 任务集 ID，例如 TS-ASSISTANT。
          schema:
            type: string
        - name: start_date
          in: query
          description: 开始日期，格式 2006-01-02。
          schema:
            type: string
        - name: end_date
          in: query
          description: 结束日期，格式 2006-01-02。
          schema:
            type: string
      responses:
        "200":
          description: mock 人员工作量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/count_task_set_tasks:
    get:
      operationId: count_task_set_tasks
      summary: 任务管理系统_任务集_任务集任务数量统计接口
      description: 任务集的任务数量统计。
      parameters:
        - name: task_set_id
          in: query
          description: 任务集 ID。
          schema:
            type: string
      responses:
        "200":
          description: mock 任务数量统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/get_config_params:
    get:
      operationId: get_config_params
      summary: 任务管理系统_配置参数_查询接口
      description: 获取字典信息接口。
      parameters:
        - name: dict_type
          in: query
          description: 字典类型，例如 task_status、task_priority、task_set_status。
          schema:
            type: string
      responses:
        "200":
          description: mock 字典信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/get_outsource_workload_sum:
    get:
      operationId: get_outsource_workload_sum
      summary: 任务管理系统_报表统计_获取外包人员工作量之和接口
      description: 根据处室和时间获取对应外包人员工作量之和。
      parameters:
        - name: department
          in: query
          description: 处室名称。
          schema:
            type: string
        - name: start_date
          in: query
          description: 开始日期，格式 2006-01-02。
          schema:
            type: string
        - name: end_date
          in: query
          description: 结束日期，格式 2006-01-02。
          schema:
            type: string
      responses:
        "200":
          description: mock 外包工作量之和
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/create_main_task:
    post:
      operationId: create_main_task
      summary: 任务管理系统_任务_创建接口
      description: 新增主任务。mock 阶段只返回模拟创建结果。
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskMutation"
      responses:
        "200":
          description: mock 创建结果
          content:
            application/json:
