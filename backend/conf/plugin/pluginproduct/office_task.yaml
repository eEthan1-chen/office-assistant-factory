  /api/mock/office_task/query_tasks:
    get:
      operationId: query_tasks
      summary: 任务管理系统_任务_查询接口
      description: 查询任务(包含归档)。
      parameters:
        - name: keyword
          in: query
          description: 关键词，可匹配标题、描述、负责人、项目和标签。
          schema:
            type: string
        - name: status
          in: query
          description: 任务状态，支持 todo、in_progress、blocked、done、archived。
          schema:
            type: string
        - name: priority
          in: query
          description: 优先级，支持 urgent、high、medium、low。
          schema:
            type: string
        - name: task_set_id
          in: query
          description: 任务集 ID。
          schema:
            type: string
        - name: owner
          in: query
          description: 负责人名称。
          schema:
            type: string
        - name: include_archived
          in: query
          description: 是否包含归档任务。
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: mock 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
components:
  schemas:
    GenericResponse:
      type: object
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
    WorkHourQuery:
      type: object
      properties:
        user_name:
          type: string
          description: 人员姓名，默认当前用户。
        start_date:
          type: string
          description: 开始日期，格式 2006-01-02。
        end_date:
          type: string
          description: 结束日期，格式 2006-01-02。
        task_set_id:
          type: string
          description: 任务集 ID。
        task_id:
          type: string
          description: 任务 ID。
    TaskMutation:
      type: object
      properties:
        task_id:
          type: string
          description: 任务 ID。
        task_set_id:
          type: string
          description: 任务集 ID。
        title:
          type: string
          description: 任务标题。
        description:
          type: string
          description: 任务描述。
        owner:
          type: string
          description: 负责人。
        priority:
          type: string
          description: 优先级。
        due_time:
          type: string
          description: 截止时间。
        reason:
          type: string
          description: 操作原因。
    TaskSetMutation:
      type: object
      properties:
        task_set_id:
          type: string
          description: 任务集 ID。
        task_set_name:
          type: string
          description: 任务集名称。
        description:
          type: string
          description: 任务集描述。
        owner:
          type: string
          description: 负责人。
        members:
          type: array
          items:
            type: string
          description: 成员列表。
        reason:
          type: string
          description: 操作原因。
servers:
  - url: http://coze-server:8888
