                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/list_task_sets:
    get:
      operationId: list_task_sets
      summary: 任务管理系统_任务集_查询接口
      description: 获取所属任务集列表。
      parameters:
        - name: owner
          in: query
          description: 负责人或成员姓名。
          schema:
            type: string
        - name: status
          in: query
          description: 任务集状态，支持 active、archived、deleted。
          schema:
            type: string
      responses:
        "200":
          description: mock 任务集列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        default:
          description: ""
  /api/mock/office_task/archive_task_set:
