  /api/mock/office_task/activate_archived_task_set:
    post:
      operationId: activate_archived_task_set
      summary: 任务管理系统_任务集_激活归档的任务集接口
      description: 根据taskSetId激活归档任务集。mock 阶段只返回模拟结果。
